<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333d"/>
      <stop offset="0.08" stop-color="#26262e"/>
      <stop offset="1" stop-color="#17171c"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a66"/>
      <stop offset="0.15" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- window body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bezel)"/>
    <rect x="106" y="106" width="812" height="812" rx="180" fill="url(#bg)"/>
  </g>

  <!-- tab bar divider, broken under the active tab -->
  <line x1="118" y1="310" x2="252" y2="310" stroke="#ffffff" stroke-opacity="0.2" stroke-width="18"/>
  <line x1="550" y1="310" x2="906" y2="310" stroke="#ffffff" stroke-opacity="0.2" stroke-width="18"/>
  <!-- active tab: left/top/right borderlines, rounded top corners, open bottom -->
  <path d="M 252 310 L 252 206 Q 252 176 282 176 L 520 176 Q 550 176 550 206 L 550 310"
        fill="#ffffff" fill-opacity="0"
        stroke="#bbbbbb" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
  <circle cx="310" cy="240" r="24" fill="#ff4422" stroke-width="8"/>
  <circle cx="630" cy="240" r="24" fill="#99ff22" stroke-width="8"/>

  <!-- prompt chevron -->
  <path d="M 240 500 L 350 610 L 240 720" fill="none" stroke="#b8bcc8" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Claude starburst -->
  <g transform="translate(600 610)" stroke="#d97757" stroke-width="40" stroke-linecap="round">
    <line x1="0" y1="0" x2="178" y2="0" transform="rotate(0)"/>
    <line x1="0" y1="0" x2="106" y2="0" transform="rotate(33)"/>
    <line x1="0" y1="0" x2="176" y2="0" transform="rotate(63)"/>
    <line x1="0" y1="0" x2="104" y2="0" transform="rotate(95)"/>
    <line x1="0" y1="0" x2="180" y2="0" transform="rotate(128)"/>
    <line x1="0" y1="0" x2="108" y2="0" transform="rotate(160)"/>
    <line x1="0" y1="0" x2="176" y2="0" transform="rotate(190)"/>
    <line x1="0" y1="0" x2="106" y2="0" transform="rotate(222)"/>
    <line x1="0" y1="0" x2="178" y2="0" transform="rotate(252)"/>
    <line x1="0" y1="0" x2="104" y2="0" transform="rotate(285)"/>
    <line x1="0" y1="0" x2="174" y2="0" transform="rotate(318)"/>
  </g>
</svg>
